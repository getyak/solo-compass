name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: dependency patch regressions
        run: pnpm security:patch-check

      - name: dependency audit
        run: pnpm audit --audit-level=low

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: production build
        run: pnpm build

      - name: format check
        run: pnpm format:check

      - name: anti-pattern lint
        if: github.event_name == 'pull_request'
        run: pnpm tsx scripts/anti-pattern-lint.ts

      - name: schema dryrun
        run: pnpm tsx scripts/schema-dryrun.ts

      - name: parity check
        run: pnpm parity:check

      # Portable subset of the local iOS simulator policy tests. Every
      # simulator command is a fake on PATH, so this never touches Xcode or a
      # real simulator. The macOS-only tests (dev-ios-session reexec,
      # /usr/bin/shlock reservation) skip here with explicit reasons and are
      # executed with skips disallowed by the SwiftLint job in ios-ci.yml.
      - name: iOS policy tests (portable, fake tools)
        run: python3 -m unittest discover -s scripts/ios -p 'test_*.py' -v

      - name: iOS policy script syntax
        run: |
          bash -n scripts/ios/session.sh
          bash -n scripts/sc-evaluator/run.sh
          bash -n scripts/sc-executor/run.sh
          bash -n scripts/user-story-rubric/run.sh
          bash -n scripts/qa/two-sim-friend-loop.sh

  go-security:
    name: Go test + vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: verify module checksums
        run: go mod verify

      - name: test
        run: go test ./...

      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
