name: iOS CI

on:
  # Only run on main pushes — feature/dual-agent branches are validated via
  # their pull_request. Pushing CI on every '**' branch flooded the scarce
  # macOS runner queue (each distinct ref = its own concurrency group).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-parity:
    name: TS↔Swift Schema Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TS↔Swift schema parity
        run: pnpm parity:check

  build-and-test:
    name: Build iOS app (placeholder secrets)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [schema-parity]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create placeholder .env
        env:
          # Optional: inject the real Amap key from repo secrets so the
          # CI build matches what TestFlight ships. Empty when the secret
          # isn't configured (open-source forks) — AmapPOIService still
          # builds and the wire-format contract tests still run because
          # they decode inline JSON fixtures, not live network responses.
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          printf 'DEEPSEEK_API_KEY=\n' > .env
          printf 'DEEPSEEK_BASE_URL=https://api.deepseek.com/v1\n' >> .env
          printf 'DEEPSEEK_MODEL=deepseek-flash\n' >> .env
          printf 'SENTRY_DSN=\n' >> .env
          printf 'AMAP_API_KEY=%s\n' "${AMAP_API_KEY}" >> .env
          printf 'DEVELOPMENT_TEAM=%s\n' "$DEVELOPMENT_TEAM" >> .env

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          candidates = []
          for runtime, devices in json.load(open(sys.argv[1]))["devices"].items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              version = tuple(int(part) for part in runtime.split("iOS-")[1].split("-"))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"] == "iPhone 17 Pro", device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator on this runner")
          version, _, name, udid = max(candidates)
          print(f"Selected {name} on iOS {'.'.join(map(str, version))}: {udid}")
          with open(sys.argv[2], "a") as output:
              output.write(f"udid={udid}\n")
          PY

      # Regenerate the project from project.yml so CI compiles the exact same
      # source set TestFlight does. The committed .xcodeproj drifts out of sync
      # (xcodegen owns it — see CLAUDE.md), which previously let new files with
      # compile errors pass CI while failing the TestFlight archive.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: |
          cd apps/ios
          xcodegen generate --spec project.yml

      - name: Build iOS App
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild build \
            -project SoloCompass.xcodeproj \
            -scheme SoloCompass \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

          echo "✅ BUILD SUCCEEDED"

      - name: Run Unit Tests
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild test \
            -project SoloCompass.xcodeproj \
            -scheme SoloCompass \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

          echo "✅ TESTS PASSED"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: apps/ios/build.log

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs
          path: apps/ios/test.log

  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          cd apps/ios
          swiftlint --strict 2>&1 | tee swiftlint.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "⚠️ SwiftLint found issues (non-blocking for MVP)"
          fi

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swiftlint-report
          path: apps/ios/swiftlint.log

  ralph:
    name: Ralph Continuous Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ios-mvp'
    runs-on: macos-latest
    needs: [build-and-test]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.246

      - name: Run Ralph
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts/ralph
          ./ralph.sh --tool claude 3

      - name: Push Changes
        run: |
          git push origin feat/ios-mvp || echo "No changes to push"
